[project]
name = "mcp-server-blueprint"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohamad-Hachem" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncio>=4.0.0",
    "dotenv>=0.9.9",
    "fastmcp>=4.1.4",
    "langchain-openai>=1.7.3",
    "langchain[mcp]>=1.4.7",
    "uuid>=1.30",
]

[project.scripts]
mcp-server-blueprint = "mcp_server_blueprint:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
